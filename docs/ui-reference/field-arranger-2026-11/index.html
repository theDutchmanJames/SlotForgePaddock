<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field arranger redesign</title>
<!-- Car photos come from .qa/preview-cars (ignored by git), made from the local library; they are not part of the repository. -->
<style>
@font-face{font-family:'SF Barlow Condensed';src:url('../../../renderer/fonts/barlowcondensed/BarlowCondensed-BoldItalic.ttf') format('truetype');font-weight:700;font-style:italic}
@font-face{font-family:'SF Roboto Mono';src:url('../../../renderer/fonts/robotomono/RobotoMono[wght].ttf') format('truetype');font-weight:100 700}
:root{--bg:#171b21;--panel:#222831;--raised:#2a313b;--ink:#e8e6e1;--ink2:#c4c8ce;--muted:#98a0ab;--faint:#6b7380;--line:#343b47;--line2:#2b313b;--accent:#e5484d;--ok:#3ecf8e;--amber:#edbd6a;--blue:#79b5ed;--violet:#a88cda;--green:#67c79b;
  --cond:'SF Barlow Condensed','Bahnschrift',sans-serif;--mono:'SF Roboto Mono',Consolas,monospace;--ui:'Segoe UI',system-ui,sans-serif;color-scheme:dark}
[data-theme=light]{--bg:#f1efea;--panel:#fff;--raised:#f0eee9;--ink:#1d2229;--ink2:#3a414c;--muted:#656c76;--faint:#8a929d;--line:#d9d6cf;--line2:#e6e3dd;--accent:#c92424;--amber:#a7741c;--blue:#236db4;--ok:#1f9a62;--green:#187a50;--violet:#7950a6;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--ui);overflow:hidden}
button,input{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-weight:500}
h1,h2,h3,h4{font-family:var(--cond);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0}
.eye{font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.grow{flex:1}
.switch{position:relative;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;height:46px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line2)}
.switch b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.switch p{margin:0 0 0 auto;font-size:12px;color:var(--faint)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--bg) 60%,var(--panel))}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:color-mix(in srgb,var(--ink) 12%,var(--panel));color:var(--ink);font-weight:600}
.app{position:absolute;inset:46px 0 0;filter:blur(2px);opacity:.45}
.chrome{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent)}
.backdrop{position:absolute;inset:46px 0 0;background:rgba(5,7,10,.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:5px 12px;border:1px solid transparent;border-radius:8px;background:color-mix(in srgb,var(--ink) 8%,var(--panel));color:var(--ink);font-size:13px;white-space:nowrap;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}.btn.ghost{background:transparent;color:var(--muted)}.btn.small{min-height:27px;padding:3px 10px;font-size:12.5px}
input.f{width:100%;min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);outline:none}
.fl{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.win{position:absolute;left:50%;top:calc(46px + 26px);transform:translateX(-50%);width:min(1260px,calc(100vw - 40px));height:calc(100vh - 46px - 52px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.whead{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
.whead h2{font-size:24px;line-height:1}.whead p{margin:0;font-size:12.5px;color:var(--muted)}.whead .x{margin-left:auto;color:var(--muted);font-size:18px}
.wbody{flex:1;min-height:0;display:flex}
.wfoot{display:flex;align-items:center;gap:10px;padding:11px 20px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 40%,var(--panel))}
.wfoot .sum{font-size:12.5px;color:var(--muted)}.wfoot .sum b{color:var(--ink)}
/* field arranger */
.wbody{flex:1;min-height:0;display:flex}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.ch{padding:12px 18px 10px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.ch h3{font-size:17px}.ch .count{margin-left:auto;font-size:12px;color:var(--muted)}.ch .count b{color:var(--ink);font-family:var(--mono)}
.cb{flex:1;min-height:0;overflow:auto;padding:10px 18px 16px}
.q{position:relative}.q input{padding-left:32px}.q::before{content:'⌕';position:absolute;left:11px;top:5px;font-size:18px;color:var(--muted)}
.grp{display:flex;align-items:center;gap:10px;margin:14px 0 6px;font:600 9.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grp::after{content:'';flex:1;height:1px;background:var(--line2)}
.grp:first-child{margin-top:4px}
/* A: available chips + shown list */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12.5px;cursor:pointer}
.chip i{font-style:normal;color:var(--blue);font-weight:700}
.chip.on{border-color:color-mix(in srgb,var(--blue) 50%,var(--line));background:color-mix(in srgb,var(--blue) 12%,var(--panel));color:var(--ink)}
.chip.on i{color:var(--green)}
.chip.dim{opacity:.4;cursor:not-allowed}
.ord{display:grid;gap:5px}
.oi{display:grid;grid-template-columns:16px 22px minmax(0,1fr) auto auto;gap:9px;align-items:center;min-height:38px;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13px}
.oi .grip{color:var(--faint);cursor:grab;letter-spacing:-2px}
.oi .n{font:700 11.5px var(--mono);color:var(--blue)}
.oi .g{font-size:10.5px;color:var(--muted)}
.oi .acts{display:flex;gap:1px;color:var(--muted)}
.oi .acts span{width:26px;text-align:center}
.oi.lock{background:color-mix(in srgb,var(--ink) 4%,var(--panel))}.oi.lock .acts{opacity:.4}
.oi.drag{border-color:var(--blue);box-shadow:0 10px 26px rgba(0,0,0,.4);transform:translateX(8px) rotate(-.4deg)}
.oi.gap{border-style:dashed;background:transparent;min-height:38px}
.meter{height:5px;border-radius:9px;background:var(--line2);overflow:hidden;margin:8px 0 0}.meter i{display:block;height:100%;background:var(--blue)}
/* preview */
.pv{flex:none;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 40%,var(--panel));padding:12px 18px 14px}
.pv .eye{margin-bottom:8px}
.tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.tbl table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.tbl th{padding:8px 10px;text-align:left;font:600 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl tr:last-child td{border-bottom:0}
.tbl td.nm{display:flex;align-items:center;gap:8px;font-weight:600}.tbl td.nm img{width:46px;height:29px;object-fit:cover;border-radius:5px}
.tbl th.hot{color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.tbl th.ghost{outline:2px dashed var(--blue);outline-offset:-4px;color:var(--blue)}
.pill{display:inline-block;padding:0 7px;border-radius:999px;font-size:11px;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
/* B: live preview on top, header chips */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 20px;gap:12px;overflow:auto}
.hdr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;border:1px dashed var(--line);border-radius:11px}
.hc{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 10px;border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));border-radius:8px;background:color-mix(in srgb,var(--blue) 10%,var(--panel));font-size:12.5px;font-weight:600}
.hc .grip{color:var(--faint);letter-spacing:-2px;cursor:grab}.hc .x{color:var(--muted);font-weight:400;padding:0 4px}
.hc.lock{border-color:var(--line);background:color-mix(in srgb,var(--ink) 6%,var(--panel))}
.hc.drag{box-shadow:0 10px 24px rgba(0,0,0,.4);transform:translateY(-3px) rotate(-1deg)}
.hint{font-size:12px;color:var(--muted)}
.tray{flex:none;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 30%,var(--panel));padding:10px 20px 14px;max-height:250px;overflow:auto}
.tray .row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;padding:5px 0}
.tray .row .eye{padding-top:7px}
/* C: one checklist */
.ck{display:grid;grid-template-columns:16px 18px minmax(0,1fr) auto;gap:9px;align-items:center;min-height:34px;padding:3px 10px;border-radius:8px;font-size:13px}
.ck:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.box{width:17px;height:17px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:11px;color:#fff}
.ck.on .box{background:var(--blue);border-color:var(--blue)}
.ck .grip{color:var(--faint);letter-spacing:-2px}.ck:not(.on) .grip{visibility:hidden}
.ck .v{font:500 11.5px var(--mono);color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck.on{background:color-mix(in srgb,var(--blue) 7%,transparent)}
.ck.drag{background:var(--panel);border:1px solid var(--blue);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.sep{height:1px;background:var(--line);margin:10px 0}
/* panel preview (Choose fields) */
.pn{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.pn .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.pn .ph h4{font-size:16px}
.pn dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:0}
.pn dl div{padding:9px 16px;border-bottom:1px solid var(--line2)}
.pn dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pn dd{margin:2px 0 0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn dl div.hot{background:color-mix(in srgb,var(--blue) 9%,transparent)}
.car{display:flex;gap:12px;align-items:center;margin-bottom:12px}.car img{width:96px;height:60px;object-fit:cover;border-radius:8px}.car b{font:italic 700 18px var(--cond);text-transform:uppercase}
.tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line2)}
.tabs span{padding:9px 12px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}.tabs span.on{color:var(--ink);font-weight:600;border-color:var(--accent)}
</style>
</head>
<body>
<div class="switch">
 <b>Window</b><div class="seg" id="wSeg"><button data-w="table" class="on">Table columns</button><button data-w="panel">Choose fields</button></div>
 <b>Option</b><div class="seg" id="oSeg"><button data-o="a" class="on">A · Two lists</button><button data-o="b">B · Arrange on the preview</button><button data-o="c">C · One checklist</button></div>
 <b>Theme</b><div class="seg" id="tSeg"><button data-t="dark" class="on">Dark</button><button data-t="light">Light</button></div>
</div>
<div class="app"><div class="chrome"><div class="logo"></div></div></div>
<div class="backdrop"></div>
<div class="win" id="win"></div>
<script>
const CARS=[["car-2.jpg","BMW Z4","NSR","1:32","Club racer","Shelf 2","Ready","Shark 25K","12 / 34","78 g"],["car-9.jpg","Porsche 952KH","Slot.it","1:32","Le Mans","Shelf 1","Ready","V12/6 21.5K","11 / 32","74 g"],["car-5.jpg","Nissan R390","Slot.it","1:32","Le Mans","Box 3","In workshop","V12/6 21.5K","10 / 30","76 g"],["car-1.jpg","Mosler MT900R","NSR","1:32","Club racer","Shelf 2","Ready","King Evo","12 / 33","81 g"]];
const FIELDS={'Car details':[['name','Name'],['maker','Maker'],['reference','Reference'],['number','Race number'],['scale','Scale'],['raceClass','Class'],['usage','Usage'],['tags','Tags'],['location','Location'],['availability','Availability'],['price','Price'],['purchased','Purchased'],['picture','Picture']],'Technical specifications':[['tech_motor','Motor'],['tech_gearing','Pinion / gear'],['tech_weight','Weight'],['tech_rearTyres','Rear tyres'],['tech_frontTyres','Front tyres'],['tech_guide','Guide'],['tech_magnet','Magnet'],['tech_chassis','Chassis']],'Your own fields':[['custom_livery','Livery year'],['custom_box','Box condition']]};
const LABEL=Object.fromEntries(Object.values(FIELDS).flat());
const GROUP=Object.fromEntries(Object.entries(FIELDS).flatMap(([g,l])=>l.map(([k])=>[k,g])));
const VAL={name:i=>CARS[i][1],maker:i=>CARS[i][2],scale:i=>CARS[i][3],usage:i=>`<span class="pill">${CARS[i][4]}</span>`,location:i=>CARS[i][5],availability:i=>CARS[i][6],tech_motor:i=>CARS[i][7],tech_gearing:i=>CARS[i][8],tech_weight:i=>CARS[i][9],raceClass:i=>['GT','Group C','GT1','GT'][i],reference:i=>['SICA36','CA09','CA12','0811'][i]};
const SHOWN={table:['name','maker','scale','usage','location','availability','tech_motor'],panel:['maker','reference','scale','raceClass','usage','location','availability','purchased']};
let w='table',o='a';
const $=s=>document.querySelector(s);
const img=f=>'../../../.qa/preview-cars/'+f;
const head=(t,p)=>`<div class="whead"><h2>${t}</h2><p>${p}</p><span class="x">×</span></div>`;
const foot=sum=>`<div class="wfoot"><span class="sum">${sum}</span><span class="grow"></span><button class="btn ghost">Restore defaults</button><button class="btn ghost">Cancel</button><button class="btn primary">${w==='table'?'Save columns':'Save layout'}</button></div>`;
const title=()=>w==='table'?head('Table columns','Choose what the Cars table shows, and in which order'):head('Choose fields · Car details','The fields in this panel, for every car in your collection');
const keys=()=>w==='table'?SHOWN.table:SHOWN.panel;
const avail=()=>Object.entries(FIELDS).map(([g,l])=>[g,l.filter(([k])=>w==='table'||(k!=='name'&&k!=='picture'&&(w!=='panel'||!k.startsWith('tech_'))))]).filter(([,l])=>l.length);
const val=(k,i)=>(VAL[k]||(()=>'—'))(i);
function table(ks,hot,ghost){return `<div class="tbl"><table><thead><tr>${ks.map((k,x)=>`<th class="${k===hot?'hot':''} ${x===ghost?'ghost':''}">${LABEL[k]}</th>`).join('')}</tr></thead><tbody>${CARS.slice(0,3).map((c,i)=>`<tr>${ks.map(k=>k==='name'?`<td class="nm"><img src="${img(c[0])}" alt="">${c[1]}</td>`:`<td>${val(k,i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function panel(ks,hot){return `<div class="car"><img src="${img(CARS[1][0])}" alt=""><div><div class="eye">Preview · your car</div><b>${CARS[1][1]}</b></div></div><div class="pn"><div class="ph"><h4>Car details</h4></div><dl>${ks.map(k=>`<div class="${k===hot?'hot':''}"><dt>${LABEL[k]}</dt><dd>${k==='purchased'?'14 Mar 2024':val(k,1)}</dd></div>`).join('')}</dl></div>`}
function preview(hot){return w==='table'?table(keys(),hot):panel(keys(),hot)}
const sumTxt=()=>`<b>${keys().length}</b> of 16 ${w==='table'?'columns':'fields'} · ${w==='table'?'saved views keep their own columns':'applies to every car'}`;

function optA(){const ks=keys();return title()+`<div class="wbody"><div class="col" style="flex:1;border-right:1px solid var(--line)"><div class="ch"><div class="q" style="width:280px"><input class="f" placeholder="Find a field…"></div><span class="count">Click to add or remove</span></div><div class="cb">${avail().map(([g,l])=>`<div class="grp">${g}</div><div class="chips">${l.map(([k,n])=>`<span class="chip ${ks.includes(k)?'on':''}"><i>${ks.includes(k)?'✓':'+'}</i>${n}</span>`).join('')}</div>`).join('')}</div>
 <div class="pv"><div class="eye">Live preview · ${w==='table'?'your first cars':'Porsche 952KH'}</div>${w==='table'?table(ks,'tech_motor'):`<div class="pn"><dl>${ks.slice(0,6).map(k=>`<div><dt>${LABEL[k]}</dt><dd>${k==='purchased'?'14 Mar 2024':val(k,1)}</dd></div>`).join('')}</dl></div>`}</div></div>
 <aside class="col" style="width:380px;flex:none;background:color-mix(in srgb,var(--bg) 22%,var(--panel))"><div class="ch"><div><div class="eye">Shown, in this order</div><h3>${w==='table'?'Your columns':'Your fields'}</h3></div><span class="count"><b>${ks.length}</b> / 16</span></div><div class="cb"><div class="ord">${ks.map((k,x)=>`<div class="oi ${k==='name'?'lock':''} ${x===3?'drag':''}"><span class="grip">⋮⋮</span><span class="n">${x+1}</span><span>${LABEL[k]}<br><span class="g">${GROUP[k]}</span></span><span class="g">${k==='name'?'always shown':''}</span><span class="acts"><span>↑</span><span>↓</span><span>×</span></span></div>`).join('')}</div><div class="meter"><i style="width:${ks.length/16*100}%"></i></div><p class="hint" style="margin:8px 0 0">Drag to reorder, or use the arrows.</p></div></aside></div>`+foot(sumTxt())}

function optB(){const ks=keys();return title()+`<div class="wbody" style="flex-direction:column"><div class="stage"><div><div class="eye" style="margin-bottom:6px">${w==='table'?'Your columns · drag to reorder':'Your fields · drag to reorder'}</div><div class="hdr">${ks.map((k,x)=>`<span class="hc ${k==='name'?'lock':''} ${x===2?'drag':''}"><span class="grip">⋮⋮</span>${LABEL[k]}${k==='name'?'':'<span class="x">×</span>'}</span>`).join('')}<span class="hint" style="margin-left:auto;padding-right:6px">${ks.length} / 16</span></div></div>
 <div><div class="eye" style="margin-bottom:6px">Exactly how it will look</div>${w==='table'?table(ks,'scale',2):panel(ks,'scale')}</div></div>
 <div class="tray"><div style="display:flex;align-items:center;gap:12px;margin-bottom:4px"><div class="eye">Add a ${w==='table'?'column':'field'}</div><div class="q" style="width:260px"><input class="f" placeholder="Find a field…"></div></div>${avail().map(([g,l])=>`<div class="row"><div class="eye">${g}</div><div class="chips">${l.filter(([k])=>!ks.includes(k)).map(([k,n])=>`<span class="chip"><i>+</i>${n}</span>`).join('')}</div></div>`).join('')}</div></div>`+foot(sumTxt())}

function optC(){const ks=keys(),rest=avail().map(([g,l])=>[g,l.filter(([k])=>!ks.includes(k))]).filter(([,l])=>l.length);
 return title()+`<div class="wbody"><div class="col" style="width:440px;flex:none;border-right:1px solid var(--line)"><div class="ch"><div class="q" style="flex:1"><input class="f" placeholder="Find a field…"></div><span class="count"><b>${ks.length}</b> / 16</span></div><div class="cb"><div class="grp">Shown · drag to reorder</div>${ks.map((k,x)=>`<div class="ck on ${x===4?'drag':''}"><span class="grip">⋮⋮</span><span class="box">✓</span><span>${LABEL[k]}</span><span class="v">${k==='purchased'?'14 Mar 2024':String(val(k,0)).replace(/<[^>]+>/g,'')}</span></div>`).join('')}<div class="sep"></div>${rest.map(([g,l])=>`<div class="grp">${g}</div>${l.map(([k,n])=>`<div class="ck"><span class="grip">⋮⋮</span><span class="box"></span><span>${n}</span><span class="v"></span></div>`).join('')}`).join('')}</div></div>
 <div class="col" style="flex:1"><div class="ch"><div><div class="eye">Live preview</div><h3>${w==='table'?'Cars table':'Car details panel'}</h3></div></div><div class="cb" style="padding-top:14px">${preview('availability')}<p class="hint" style="margin-top:12px">Tick a field to show it. Ticked fields move to the top, where you drag them into order.</p></div></div></div>`+foot(sumTxt())}

function paint(){document.documentElement.dataset.theme=document.querySelector('#tSeg .on').dataset.t;$('#win').innerHTML=({a:optA,b:optB,c:optC})[o]();}
function seg(id,attr,set){document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('on',x===b));set(b.dataset[attr]);paint();});}
seg('wSeg','w',v=>w=v);seg('oSeg','o',v=>o=v);seg('tSeg','t',()=>{});
function fromHash(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('w'))w=h.get('w');if(h.get('o'))o=h.get('o');const t=h.get('t')||'dark';[['wSeg','w',w],['oSeg','o',o],['tSeg','t',t]].forEach(([id,a,v])=>document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle('on',b.dataset[a]===v)));paint();}
addEventListener('hashchange',fromHash);fromHash();
</script>
</body>
</html>
